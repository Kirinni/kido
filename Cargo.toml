[package]
name = "kido"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "终端待办：页签、备注、鼠标勾选，单文件 exe"
license = "MIT"
repository = "https://github.com/Kirinni/kido"
readme = "README.md"
keywords = ["todo", "tui", "terminal"]
categories = ["command-line-utilities"]

[lib]
name = "kido"
path = "src/lib.rs"

[[bin]]
name = "kido"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true
